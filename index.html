<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스마트 일정관리</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; color: #333; }
        .container { width: 100%; max-width: 500px; padding: 20px; box-sizing: border-box; padding-bottom: 80px; }
        
        #login-screen { display: flex; flex-direction: column; align-items: center; margin-top: 20vh; background: white; padding: 40px 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .login-title { font-size: 24px; font-weight: 700; margin-bottom: 10px; color: #1e293b; }
        .login-sub { font-size: 14px; color: #64748b; margin-bottom: 30px; }
        input { width: 100%; padding: 16px; margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 16px; background-color: #f8fafc; box-sizing: border-box; transition: 0.3s; }
        input:focus { border-color: #3b82f6; outline: none; background-color: white; }
        button.btn-primary { width: 100%; padding: 16px; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }

        .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 20px; }
        .card-title { font-size: 16px; font-weight: 700; color: #1e293b; margin-top: 0; margin-bottom: 15px; }

        #dashboard-screen { display: none; width: 100%; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: white; box-shadow: 0 -4px 15px rgba(0,0,0,0.05); display: none; justify-content: space-around; padding: 10px 0; border-top-left-radius: 20px; border-top-right-radius: 20px; z-index: 100; }
        .nav-item { flex: 1; text-align: center; padding: 10px; font-size: 14px; color: #94a3b8; font-weight: 600; cursor: pointer; }
        .nav-item.active { color: #3b82f6; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        #qrcode { display: flex; justify-content: center; margin: 20px 0; padding: 10px; background: #fff; border-radius: 12px; }
        .time-box { display: flex; justify-content: space-between; background: #f8fafc; padding: 15px; border-radius: 12px; margin-top: 10px; }
        .time-box div { text-align: center; width: 48%; }
        .time-label { font-size: 12px; color: #64748b; }
        .time-value { font-size: 20px; font-weight: 700; color: #0f172a; margin-top: 5px; }

        .stamp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .stamp-box { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 15px 5px; text-align: center; position: relative; background-color: #f8fafc; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        .stamp-box.stamped { border-color: #22c55e; background-color: #f0fdf4; }
        .doc-name { font-size: 13px; font-weight: 600; color: #475569; position: relative; z-index: 2; word-break: keep-all; }
        .stamp-mark { display: none; font-size: 45px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg); z-index: 1; opacity: 0.8; }
        .stamped .stamp-mark { display: block; }

        .pdf-container { width: 100%; height: 50vh; border-radius: 12px; overflow: hidden; background:#f1f5f9; margin-top: 10px; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen">
        <div class="login-title">활동지원사 로그인</div>
        <div class="login-sub">이름과 전화번호 뒷자리를 입력해주세요</div>
        <input type="text" id="userName" placeholder="이름 (예: 홍길동)">
        <input type="tel" id="userPhone" placeholder="전화번호 뒷자리 (예: 5678)">
        <button class="btn-primary" onclick="login()">시작하기</button>
        <div id="loading" style="display:none; color:#3b82f6; margin-top:15px; font-size:14px;">데이터를 불러오는 중...</div>
    </div>

    <div id="dashboard-screen">
        <div id="tab-home" class="tab-content active">
            <h2 style="font-size: 22px; margin-bottom: 20px;"><span id="welcomeMsg"></span>님, 안녕하세요!</h2>
            <div class="card">
                <div class="card-title">📱 나의 출근 바코드 (QR)</div>
                <div id="qrcode"></div>
                <div class="time-box">
                    <div>
                        <div class="time-label">이번 달 실제 근무</div>
                        <div class="time-value"><span id="realTime" style="color:#3b82f6;">0</span>h</div>
                    </div>
                    <div>
                        <div class="time-label">이번 달 가산 적용</div>
                        <div class="time-value"><span id="extraTime" style="color:#f59e0b;">0</span>h</div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-title">📅 이번 주 일정표</div>
                <div class="pdf-container">
                    <iframe id="pdfFrame" src=""></iframe>
                </div>
            </div>
        </div>

        <div id="tab-mission" class="tab-content">
            <h2 style="font-size: 22px; margin-bottom: 20px;">서류 미션 현황</h2>
            <div id="successBanner" style="display:none; background:#fef08a; padding:15px; border-radius:12px; margin-bottom:20px; text-align:center; font-weight:bold; color:#854d0e;">
                🎉 완벽해요! 모든 필수 서류를 제출하셨습니다.
            </div>
            <div class="card">
                <div class="card-title">필수 서류 스탬프 투어</div>
                <div class="stamp-grid" id="stampGrid"></div>
            </div>
            <button onclick="logout()" style="width:100%; padding:15px; background:#ef4444; color:white; border:none; border-radius:12px; font-weight:bold; margin-top:20px;">로그아웃</button>
        </div>
    </div>
</div>

<div class="bottom-nav" id="bottomNav">
    <div class="nav-item active" onclick="switchTab('home')">🏠 홈 (일정)</div>
    <div class="nav-item" onclick="switchTab('mission')">💮 서류 (스탬프)</div>
</div>

<script>
    // ★★★ 새로 발급받은 API URL과 깃허브 URL 입력 ★★★
    const API_URL = "https://script.google.com/macros/s/AKfycbytGkJgzP_D7sAvW847BZpjBYajoLwkTNdjDwJ1ZsF0XcwQhtVXKuFf7bjK-mwCVV-5Cg/exec";
    const GITHUB_URL = "https://rudcjs277-cmyk.github.io/activity-"; 

    function login() {
        const name = document.getElementById('userName').value.trim();
        const phone = document.getElementById('userPhone').value.trim();
        if(!name || !phone) return alert("입력칸을 모두 채워주세요.");
        
        document.getElementById('loading').style.display = 'block';

        fetch(`${API_URL}?name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                if(data.success) {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('dashboard-screen').style.display = 'block';
                    document.getElementById('bottomNav').style.display = 'flex';
                    
                    document.getElementById('welcomeMsg').innerText = name;
                    document.getElementById('realTime').innerText = data.realHours || 0;
                    document.getElementById('extraTime').innerText = data.extraHours || 0;
                    document.getElementById('pdfFrame').src = data.pdfLink || ""; // 통합 일정표 바로 표시

                    const scanUrl = `${GITHUB_URL}/scan.html?n=${encodeURIComponent(name)}&p=${encodeURIComponent(phone)}`;
                    document.getElementById('qrcode').innerHTML = "";
                    new QRCode(document.getElementById("qrcode"), { text: scanUrl, width: 140, height: 140 });

                    const stampGrid = document.getElementById('stampGrid');
                    stampGrid.innerHTML = "";
                    let allCompleted = true;
                    let hasDocs = false;

                    if(data.docs && data.docs.length > 0) {
                        hasDocs = true;
                        data.docs.forEach(doc => {
                            if (!doc.status) allCompleted = false;
                            stampGrid.innerHTML += `
                                <div class="stamp-box ${doc.status ? 'stamped' : ''}">
                                    <div class="doc-name">${doc.name}</div>
                                    <div class="stamp-mark">💮</div>
                                </div>
                            `;
                        });
                    } else { allCompleted = false; }
                    document.getElementById('successBanner').style.display = (allCompleted && hasDocs) ? 'block' : 'none';
                } else { alert("정보를 찾을 수 없습니다."); }
            }).catch(e => {
                document.getElementById('loading').style.display = 'none';
                alert("통신 오류가 발생했습니다.");
            });
    }

    function switchTab(tab) {
        document.getElementById('tab-home').classList.remove('active');
        document.getElementById('tab-mission').classList.remove('active');
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if(tab === 'home') {
            document.getElementById('tab-home').classList.add('active');
            document.querySelectorAll('.nav-item')[0].classList.add('active');
        } else {
            document.getElementById('tab-mission').classList.add('active');
            document.querySelectorAll('.nav-item')[1].classList.add('active');
        }
    }
    function logout() { location.reload(); }
</script>
</body>
</html>
