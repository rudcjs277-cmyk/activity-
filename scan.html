<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 스캔 결과</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #2c3e50; font-size: 24px; margin-top: 0; }
        .info-box { background: #f8fafc; border-radius: 12px; padding: 15px; margin-bottom: 15px; text-align: left; }
        .label { font-size: 12px; color: #64748b; font-weight: bold; margin-bottom: 5px; }
        .value { font-size: 16px; color: #0f172a; font-weight: bold; word-break: keep-all; }
        .alert-text { color: #e74c3c; }
        #loading { color: #3b82f6; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1>📋 스캔 결과</h1>
    <div id="loading">데이터를 불러오는 중입니다...</div>
    <div id="resultArea" style="display: none;">
        <h2 id="empName" style="color: #3b82f6; margin-bottom: 20px;"></h2>
        
        <div class="info-box">
            <div class="label">📌 당월 필요 서류</div>
            <div class="value alert-text" id="monthDoc"></div>
        </div>
        
        <div class="info-box">
            <div class="label">💬 문의 및 특이사항</div>
            <div class="value" id="inquiry"></div>
        </div>

        <div class="info-box">
            <div class="label">⚠️ 미제출 필수 서류 (스탬프)</div>
            <div class="value" id="missingDocs" style="color: #f39c12;"></div>
        </div>
    </div>
</div>

<script>
    // ★★★ 앱스 스크립트 웹 앱 URL을 붙여넣으세요 ★★★
    const API_URL = "이곳에_웹앱_URL을_붙여넣으세요";

    // URL에서 이름과 번호를 빼옵니다.
    const urlParams = new URLSearchParams(window.location.search);
    const name = urlParams.get('n');
    const phone = urlParams.get('p');

    if(name && phone) {
        fetch(`${API_URL}?name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                if(data.success) {
                    document.getElementById('resultArea').style.display = 'block';
                    document.getElementById('empName').innerText = `${name} 활동지원사`;
                    document.getElementById('monthDoc').innerText = data.monthDoc;
                    document.getElementById('inquiry').innerText = data.inquiry;
                    
                    if(data.missingDocs && data.missingDocs.length > 0) {
                        document.getElementById('missingDocs').innerText = data.missingDocs.join(", ");
                    } else {
                        document.getElementById('missingDocs').innerText = "모두 제출 완료!";
                        document.getElementById('missingDocs').style.color = "#27ae60";
                    }
                } else {
                    document.getElementById('loading').innerText = "일치하는 직원을 찾을 수 없습니다.";
                }
            }).catch(e => {
                document.getElementById('loading').innerText = "통신 오류가 발생했습니다.";
            });
    } else {
        document.getElementById('loading').innerText = "잘못된 QR코드입니다.";
    }
</script>
</body>
</html>
